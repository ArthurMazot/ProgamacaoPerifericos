; PlatformIO Project Configuration File (gerador de sinais, ESP32-C3)
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200 ; Força o monitor a operar em 115200 baud rate

build_flags = 
    -DARDUINO_USB_MODE=1 ; USB nativo da C3, necessário para o Serial funcionar
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Serial.print() sai pela USB em vez dos pinos 20 e 21
