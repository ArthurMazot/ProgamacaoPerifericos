;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps = 
    mikalhart/TinyGPSPlus@^1.1.0 ; Adiciona a biblioteca <TinyGPS++.h>
    knolleary/PubSubClient @ ^2.8 ; Adiciona a biblioteca <PubSubClient.h>
    adafruit/DHT sensor library @ ^1.4.6 ; Adiciona a biblioteca <DHT.h>
    adafruit/Adafruit Unified Sensor @ ^1.1.14 ; Adiciona a biblioteca <Adafruit_Sensor.h>
    arduino-libraries/LiquidCrystal @ ^1.0.7 ; Adiciona a biblioteca <LiquidCrystal.h>

monitor_speed = 115200 ; Força o monitor a operar em 115200 baud rate
